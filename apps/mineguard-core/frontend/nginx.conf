# TerraMesh AI — frontend container nginx configuration (conf.d style).
# Serves the built React SPA and reverse-proxies API + WebSocket traffic to
# the FastAPI backend service.

# Rate-limit zone — http-level directive (conf.d files are included in the
# http context; the zone must be declared OUTSIDE the server block).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers (defense in depth alongside backend middleware)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API rate limiting (uses the http-level zone above)
    limit_req zone=api_limit burst=40 nodelay;

    # Serve React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API to FastAPI
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket support (live monitoring dashboard)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
