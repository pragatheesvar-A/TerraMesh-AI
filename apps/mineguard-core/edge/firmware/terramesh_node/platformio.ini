; TerraMesh AI — ESP32-S3 node reference build
; PlatformIO project: `pio run -t upload` (requires the PlatformIO toolchain —
; NOT present in the repository's development environment; this file exists so
; the reference firmware compiles the moment a toolchain is available).

[env:heltec_esp32s3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
    -DLORA_LIB_PRESENT
lib_deps =
    ; Radio driver for the Heltec SX1262 mesh uplink
    jgromes/RadioLib@^6.6.0
    ; Sensor vendors (full build)
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit VL53L0X@^1.2.4
    bogde/HX711@^2.1.0
