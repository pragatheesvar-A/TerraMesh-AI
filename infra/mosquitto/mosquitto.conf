# TerraMesh AI — Mosquitto MQTT broker configuration (DEVELOPMENT instance)
#
# This instance is bound to 127.0.0.1 by docker-compose.yml (loopback only),
# which is why anonymous access is tolerated HERE.
#
# For production posture (broker auth + TLS + topic ACL), use
#   infra/mosquitto/mosquitto.conf.production
# together with  infra/mosquitto/acl_file  — see DEPLOYMENT.md.

per_listener_settings true

# ── Primary MQTT listener (backend + local edge nodes) ──────────────────────
listener 1883
protocol mqtt
allow_anonymous true
max_connections 500

# ── Persistence & logging ────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
